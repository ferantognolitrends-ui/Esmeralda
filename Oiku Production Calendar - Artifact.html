document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"06f96381-e55a-4983-b09a-055d5453cb08\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n\n\n<helmet>\n  <style>\n    body{margin:0;background:#f5f6f4;}\n    ::-webkit-scrollbar{height:8px;width:8px}\n    ::-webkit-scrollbar-thumb{background:#d8d6d0;border-radius:4px}\n  <\u002Fstyle>\n  <script src=\"aa0d9f23-93f1-4064-8750-d06bc71cf677\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"height:100vh;width:100vw;display:flex;flex-direction:column;background:#f5f6f4;color:#1f2427;font-family:'Helvetica Neue',Arial,sans-serif;overflow:hidden;\">\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid #e2e0d8;flex-shrink:0;\">\n    <div>\n      <div style=\"font-size:20px;font-weight:700;letter-spacing:0.02em;\">OIKU \u00b7 Calend\u00e1rio de Produ\u00e7\u00e3o<\u002Fdiv>\n      <div style=\"font-size:13px;color:#6b6f66;margin-top:2px;\">Pesquisa \u2192 Design \u2192 Produ\u00e7\u00e3o \u2192 Revis\u00e3o \u2192 Lan\u00e7amento<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:16px;\">\n      <div sc-camel-on-click=\"{{ startCreate }}\" style=\"cursor:pointer;padding:9px 16px;border-radius:8px;background:#1f2427;color:#faf9f6;font-size:13px;font-weight:600;\">+ Nova pe\u00e7a<\u002Fdiv>\n      <div style=\"display:flex;background:#eceae2;border-radius:10px;padding:3px;gap:2px;\">\n        <div sc-camel-on-click=\"{{ setViewKanban }}\" style=\"padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:{{ kanbanBg }};color:{{ kanbanColor }};\">Kanban<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ setViewCalendar }}\" style=\"padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:{{ calBg }};color:{{ calColor }};\">Calend\u00e1rio<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:6px;\">\n        <div style=\"width:9px;height:9px;border-radius:50%;background:#2b3a5b;\"><\u002Fdiv><div style=\"font-size:11px;color:#6b6f66;\">Pesquisa<\u002Fdiv>\n        <div style=\"width:9px;height:9px;border-radius:50%;background:#bd8570;margin-left:8px;\"><\u002Fdiv><div style=\"font-size:11px;color:#6b6f66;\">Design<\u002Fdiv>\n        <div style=\"width:9px;height:9px;border-radius:50%;background:#e3a83c;margin-left:8px;\"><\u002Fdiv><div style=\"font-size:11px;color:#6b6f66;\">Produ\u00e7\u00e3o<\u002Fdiv>\n        <div style=\"width:9px;height:9px;border-radius:50%;background:#57624a;margin-left:8px;\"><\u002Fdiv><div style=\"font-size:11px;color:#6b6f66;\">Revis\u00e3o<\u002Fdiv>\n        <div style=\"width:9px;height:9px;border-radius:50%;background:#1f2427;margin-left:8px;\"><\u002Fdiv><div style=\"font-size:11px;color:#6b6f66;\">Lan\u00e7amento<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isKanban }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex:1;display:flex;gap:16px;padding:20px 28px;overflow-x:auto;overflow-y:hidden;\">\n      <sc-for list=\"{{ stages }}\" as=\"stage\" hint-placeholder-count=\"5\">\n        <div data-stage=\"{{ stage.key }}\" style=\"flex:0 0 260px;display:flex;flex-direction:column;background:#eceae2;border-radius:14px;overflow:hidden;height:100%;\" sc-camel-on-drag-over=\"{{ allowDrop }}\" sc-camel-on-drop=\"{{ dropFromEvent }}\">\n          <div style=\"padding:14px 16px 10px;border-bottom:2px solid {{ stage.color }};flex-shrink:0;\">\n            <div style=\"display:flex;align-items:center;gap:8px;\">\n              <div style=\"width:10px;height:10px;border-radius:50%;background:{{ stage.color }};flex-shrink:0;\"><\u002Fdiv>\n              <div style=\"font-size:14px;font-weight:700;\">{{ stage.label }}<\u002Fdiv>\n              <div style=\"margin-left:auto;font-size:12px;color:#6b6f66;\">{{ stage.count }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;color:#8a8d83;margin-top:4px;\">tempo m\u00e9dio: {{ stage.avgLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;\">\n            <sc-for list=\"{{ stage.pieces }}\" as=\"piece\" hint-placeholder-count=\"2\">\n              <div data-id=\"{{ piece.id }}\" draggable=\"true\" sc-camel-on-drag-start=\"{{ dragStartFromEvent }}\" sc-camel-on-click=\"{{ openDetailFromEvent }}\" style=\"background:#fff;border-radius:12px;padding:12px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,0.06);border:1px solid {{ piece.overdueBorder }};\">\n                <div style=\"display:flex;gap:10px;\">\n                  <div style=\"width:44px;height:44px;border-radius:8px;flex-shrink:0;overflow:hidden;\">\n                    <image-slot id=\"{{ piece.thumbId }}\" shape=\"rounded\" radius=\"8\" placeholder=\"foto\" style=\"width:44px;height:44px;\"><\u002Fimage-slot>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;\">\n                    <div style=\"font-size:13px;font-weight:700;line-height:1.25;\">{{ piece.name }}<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#8a8d83;margin-top:2px;\">{{ piece.fabric }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-top:8px;display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:{{ piece.statusBg }};color:{{ piece.statusColor }};\">{{ piece.statusLabel }}<\u002Fdiv>\n                <div style=\"display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:10px;background:#eee;\">\n                  <sc-for list=\"{{ piece.segments }}\" as=\"seg\" hint-placeholder-count=\"5\">\n                    <div style=\"width:{{ seg.width }}%;background:{{ seg.bg }};opacity:{{ seg.opacity }};\"><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;color:#6b6f66;\">\n                  <div>in\u00edcio {{ piece.startLabel }}<\u002Fdiv>\n                  <div style=\"color:{{ piece.deadlineColor }};font-weight:600;\">prazo {{ piece.deadlineLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-top:6px;display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;background:#f5f6f4;color:#6b6f66;\">{{ piece.wave }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCalendar }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;padding:16px 28px 20px;overflow:hidden;\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-shrink:0;\">\n        <div sc-camel-on-click=\"{{ prevMonth }}\" style=\"cursor:pointer;padding:6px 10px;border-radius:8px;background:#eceae2;font-size:13px;\">\u2039<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:700;min-width:140px;text-transform:capitalize;\">{{ monthLabel }}<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ nextMonth }}\" style=\"cursor:pointer;padding:6px 10px;border-radius:8px;background:#eceae2;font-size:13px;\">\u203a<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ goToday }}\" style=\"cursor:pointer;padding:6px 12px;border-radius:8px;background:#eceae2;font-size:12px;color:#6b6f66;\">hoje<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(7,1fr);flex-shrink:0;\">\n        <sc-for list=\"{{ weekdayLabels }}\" as=\"wd\" hint-placeholder-count=\"7\">\n          <div style=\"font-size:11px;color:#8a8d83;font-weight:700;padding:4px 6px;\">{{ wd }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;\">\n        <sc-for list=\"{{ weeks }}\" as=\"week\" hint-placeholder-count=\"5\">\n          <div style=\"position:relative;background:#fff;border-radius:10px;min-height:{{ week.height }}px;\">\n            <div style=\"display:grid;grid-template-columns:repeat(7,1fr);\">\n              <sc-for list=\"{{ week.days }}\" as=\"day\" hint-placeholder-count=\"7\">\n                <div style=\"padding:6px 8px;font-size:11px;color:{{ day.color }};font-weight:{{ day.weight }};\">\n                  <span style=\"background:{{ day.todayBg }};padding:2px 6px;border-radius:20px;\">{{ day.num }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ week.bars }}\" as=\"bar\" hint-placeholder-count=\"2\">\n              <div data-id=\"{{ bar.id }}\" sc-camel-on-click=\"{{ openDetailFromEvent }}\" style=\"position:absolute;left:{{ bar.left }}%;width:{{ bar.width }}%;top:{{ bar.top }}px;height:18px;border-radius:5px;overflow:hidden;display:flex;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,0.15);\">\n                <sc-for list=\"{{ bar.segments }}\" as=\"seg\" hint-placeholder-count=\"3\">\n                  <div style=\"width:{{ seg.width }}%;background:{{ seg.bg }};\"><\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"position:absolute;left:6px;top:1px;font-size:10px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-shadow:0 1px 1px rgba(0,0,0,0.4);\">{{ bar.name }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasCreating }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;background:rgba(31,36,39,0.35);display:flex;justify-content:flex-end;\" sc-camel-on-click=\"{{ cancelCreate }}\">\n      <div style=\"width:420px;max-width:92vw;height:100%;background:#faf9f6;box-shadow:-8px 0 24px rgba(0,0,0,0.15);overflow-y:auto;padding:26px;\" sc-camel-on-click=\"{{ stopClick }}\">\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;color:#6b6f66;text-transform:uppercase;\">Nova pe\u00e7a<\u002Fdiv>\n        <input value=\"{{ creating.name }}\" data-field=\"name\" sc-camel-on-change=\"{{ updateDraftFromEvent }}\" placeholder=\"Nome da pe\u00e7a\" style=\"margin-top:10px;width:100%;font-size:18px;font-weight:700;border:none;border-bottom:1px solid #eceae2;padding:6px 0;background:transparent;box-sizing:border-box;\">\n        <input value=\"{{ creating.fabric }}\" data-field=\"fabric\" sc-camel-on-change=\"{{ updateDraftFromEvent }}\" placeholder=\"Tecido\" style=\"margin-top:10px;width:100%;font-size:13px;border:none;border-bottom:1px solid #eceae2;padding:6px 0;background:transparent;color:#6b6f66;box-sizing:border-box;\">\n        <input value=\"{{ creating.wave }}\" data-field=\"wave\" sc-camel-on-change=\"{{ updateDraftFromEvent }}\" placeholder=\"Wave / cole\u00e7\u00e3o\" style=\"margin-top:10px;width:100%;font-size:13px;border:none;border-bottom:1px solid #eceae2;padding:6px 0;background:transparent;color:#6b6f66;box-sizing:border-box;\">\n\n        <div style=\"margin-top:16px;font-size:11px;color:#8a8d83;\">Data de in\u00edcio<\u002Fdiv>\n        <input type=\"date\" value=\"{{ creating.start }}\" data-field=\"start\" sc-camel-on-change=\"{{ updateDraftFromEvent }}\" style=\"margin-top:4px;font-size:13px;border:none;border-bottom:1px solid #eceae2;padding:6px 0;background:transparent;width:100%;box-sizing:border-box;\">\n\n        <div style=\"margin-top:20px;font-size:12px;font-weight:700;letter-spacing:0.04em;color:#6b6f66;text-transform:uppercase;\">Tempo por est\u00e1gio<\u002Fdiv>\n        <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:8px;\">\n          <sc-for list=\"{{ draftStages }}\" as=\"stg\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:#eceae2;\">\n              <div style=\"width:10px;height:10px;border-radius:50%;background:{{ stg.color }};flex-shrink:0;\"><\u002Fdiv>\n              <div style=\"flex:1;font-size:13px;font-weight:600;\">{{ stg.label }}<\u002Fdiv>\n              <input type=\"number\" min=\"0\" data-stage=\"{{ stg.key }}\" value=\"{{ stg.days }}\" sc-camel-on-change=\"{{ updateDraftDayFromEvent }}\" style=\"width:34px;text-align:right;font-size:12px;font-weight:600;border:none;background:transparent;\">\n              <span style=\"font-size:12px;color:#6b6f66;\">d<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;margin-top:22px;\">\n          <div sc-camel-on-click=\"{{ submitCreate }}\" style=\"flex:1;text-align:center;padding:10px;border-radius:8px;background:#1f2427;color:#faf9f6;font-size:13px;font-weight:700;cursor:pointer;\">Criar pe\u00e7a<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ cancelCreate }}\" style=\"padding:10px 16px;border-radius:8px;background:#eceae2;color:#6b6f66;font-size:13px;cursor:pointer;\">Cancelar<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasSelected }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;background:rgba(31,36,39,0.35);display:flex;justify-content:flex-end;\" sc-camel-on-click=\"{{ closeDetail }}\">\n      <div style=\"width:420px;max-width:92vw;height:100%;background:#faf9f6;box-shadow:-8px 0 24px rgba(0,0,0,0.15);overflow-y:auto;padding:26px;\" sc-camel-on-click=\"{{ stopClick }}\">\n\n        <sc-if value=\"{{ isViewing }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n            <div>\n              <div style=\"font-size:19px;font-weight:700;\">{{ selected.name }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#8a8d83;margin-top:2px;\">{{ selected.fabric }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:16px;flex-shrink:0;\">\n              <div sc-camel-on-click=\"{{ startEditFromEvent }}\" data-id=\"{{ selected.id }}\" style=\"cursor:pointer;font-size:12px;font-weight:700;color:#6b6f66;\">Editar<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ deleteSelectedFromEvent }}\" data-id=\"{{ selected.id }}\" style=\"cursor:pointer;font-size:12px;font-weight:700;color:#a8422f;\">Apagar<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ closeDetail }}\" style=\"cursor:pointer;font-size:20px;color:#8a8d83;line-height:1;\">\u00d7<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:8px;display:flex;gap:8px;\">\n            <div style=\"display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;background:#eceae2;color:#6b6f66;\">{{ selected.wave }}<\u002Fdiv>\n            <div style=\"display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:{{ selected.statusBg }};color:{{ selected.statusColor }};\">{{ selected.statusLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:8px;margin-top:20px;\">\n            <image-slot id=\"{{ selected.sketchId }}\" shape=\"rounded\" radius=\"10\" placeholder=\"sketch\" style=\"flex:1;height:110px;\"><\u002Fimage-slot>\n            <image-slot id=\"{{ selected.fabricImgId }}\" shape=\"rounded\" radius=\"10\" placeholder=\"tecido\" style=\"flex:1;height:110px;\"><\u002Fimage-slot>\n            <image-slot id=\"{{ selected.progressId }}\" shape=\"rounded\" radius=\"10\" placeholder=\"progresso\" style=\"flex:1;height:110px;\"><\u002Fimage-slot>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:24px;font-size:12px;font-weight:700;letter-spacing:0.04em;color:#6b6f66;text-transform:uppercase;\">Cronograma<\u002Fdiv>\n          <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:10px;\">\n            <sc-for list=\"{{ selected.timeline }}\" as=\"stg\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:{{ stg.rowBg }};border:1px solid {{ stg.rowBorder }};\">\n                <div style=\"width:10px;height:10px;border-radius:50%;background:{{ stg.color }};flex-shrink:0;\"><\u002Fdiv>\n                <div style=\"flex:1;\">\n                  <div style=\"font-size:13px;font-weight:700;\">{{ stg.label }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#8a8d83;\">{{ stg.startLabel }} \u2014 {{ stg.endLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:2px;\">\n                  <input type=\"number\" min=\"0\" data-id=\"{{ selected.id }}\" data-stage=\"{{ stg.key }}\" value=\"{{ stg.days }}\" sc-camel-on-change=\"{{ updateDaysFromEvent }}\" style=\"width:34px;text-align:right;font-size:12px;color:#6b6f66;font-weight:600;border:none;background:transparent;-moz-appearance:textfield;\">\n                  <span style=\"font-size:12px;color:#6b6f66;font-weight:600;\">d<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:20px;display:flex;justify-content:space-between;padding:12px 14px;background:#eceae2;border-radius:10px;\">\n            <div>\n              <div style=\"font-size:10.5px;color:#8a8d83;\">in\u00edcio<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:700;\">{{ selected.startLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:right;\">\n              <div style=\"font-size:10.5px;color:#8a8d83;\">prazo final<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:700;color:{{ selected.deadlineColor }};\">{{ selected.deadlineLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ selected.notes }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:18px;font-size:13px;color:#4a4d47;line-height:1.5;\">{{ selected.notes }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isEditing }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;color:#6b6f66;text-transform:uppercase;\">Editar pe\u00e7a<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ closeDetail }}\" style=\"cursor:pointer;font-size:20px;color:#8a8d83;line-height:1;\">\u00d7<\u002Fdiv>\n          <\u002Fdiv>\n          <input value=\"{{ editDraft.name }}\" data-field=\"name\" sc-camel-on-change=\"{{ updateEditDraftFromEvent }}\" placeholder=\"Nome da pe\u00e7a\" style=\"margin-top:10px;width:100%;font-size:18px;font-weight:700;border:none;border-bottom:1px solid #eceae2;padding:6px 0;background:transparent;box-sizing:border-box;\">\n          <input value=\"{{ editDraft.fabric }}\" data-field=\"fabric\" sc-camel-on-change=\"{{ updateEditDraftFromEvent }}\" placeholder=\"Tecido\" style=\"margin-top:10px;width:100%;font-size:13px;border:none;border-bottom:1px solid #eceae2;padding:6px 0;background:transparent;color:#6b6f66;box-sizing:border-box;\">\n          <input value=\"{{ editDraft.wave }}\" data-field=\"wave\" sc-camel-on-change=\"{{ updateEditDraftFromEvent }}\" placeholder=\"Wave / cole\u00e7\u00e3o\" style=\"margin-top:10px;width:100%;font-size:13px;border:none;border-bottom:1px solid #eceae2;padding:6px 0;background:transparent;color:#6b6f66;box-sizing:border-box;\">\n\n          <div style=\"margin-top:16px;font-size:11px;color:#8a8d83;\">Data de in\u00edcio<\u002Fdiv>\n          <input type=\"date\" value=\"{{ editDraft.start }}\" data-field=\"start\" sc-camel-on-change=\"{{ updateEditDraftFromEvent }}\" style=\"margin-top:4px;font-size:13px;border:none;border-bottom:1px solid #eceae2;padding:6px 0;background:transparent;width:100%;box-sizing:border-box;\">\n\n          <div style=\"margin-top:16px;font-size:11px;color:#8a8d83;\">Notas<\u002Fdiv>\n          <input value=\"{{ editDraft.notes }}\" data-field=\"notes\" sc-camel-on-change=\"{{ updateEditDraftFromEvent }}\" placeholder=\"Notas (opcional)\" style=\"margin-top:4px;font-size:13px;border:none;border-bottom:1px solid #eceae2;padding:6px 0;background:transparent;width:100%;box-sizing:border-box;\">\n\n          <div style=\"margin-top:20px;font-size:12px;font-weight:700;letter-spacing:0.04em;color:#6b6f66;text-transform:uppercase;\">Tempo por est\u00e1gio<\u002Fdiv>\n          <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:8px;\">\n            <sc-for list=\"{{ editDraftStages }}\" as=\"stg\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:#eceae2;\">\n                <div style=\"width:10px;height:10px;border-radius:50%;background:{{ stg.color }};flex-shrink:0;\"><\u002Fdiv>\n                <div style=\"flex:1;font-size:13px;font-weight:600;\">{{ stg.label }}<\u002Fdiv>\n                <input type=\"number\" min=\"0\" data-stage=\"{{ stg.key }}\" value=\"{{ stg.days }}\" sc-camel-on-change=\"{{ updateEditDraftDayFromEvent }}\" style=\"width:34px;text-align:right;font-size:12px;font-weight:600;border:none;background:transparent;\">\n                <span style=\"font-size:12px;color:#6b6f66;\">d<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:10px;margin-top:22px;\">\n            <div sc-camel-on-click=\"{{ saveEditFromEvent }}\" style=\"flex:1;text-align:center;padding:10px;border-radius:8px;background:#1f2427;color:#faf9f6;font-size:13px;font-weight:700;cursor:pointer;\">Salvar<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ cancelEditFromEvent }}\" style=\"padding:10px 16px;border-radius:8px;background:#eceae2;color:#6b6f66;font-size:13px;cursor:pointer;\">Cancelar<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst STAGES = [\n  { key:'research', label:'Pesquisa', color:'#2b3a5b' },\n  { key:'design', label:'Design', color:'#bd8570' },\n  { key:'production', label:'Produ\u00e7\u00e3o', color:'#e3a83c' },\n  { key:'revision', label:'Revis\u00e3o', color:'#57624a' },\n  { key:'release', label:'Lan\u00e7amento', color:'#1f2427' },\n];\nconst MONTHS_PT = ['janeiro','fevereiro','mar\u00e7o','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];\nconst WEEKDAYS_PT = ['Seg','Ter','Qua','Qui','Sex','S\u00e1b','Dom'];\n\nfunction parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }\nfunction addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }\nfunction diffDays(a,b){ return Math.round((stripTime(a)-stripTime(b))/86400000); }\nfunction stripTime(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(); }\nfunction fmtShort(d){ return d.getDate()+' '+MONTHS_PT[d.getMonth()].slice(0,3); }\n\nconst SAMPLE = [\n  { id:'p1', name:'Camisa Linho Solto', fabric:'Linho natural', wave:'Wave 3 \u2014 Ver\u00e3o', start:'2026-07-20', days:{research:3,design:5,production:8,revision:3,release:2}, actualStage:'release', notes:'' },\n  { id:'p2', name:'Cal\u00e7a Pantalona', fabric:'Alfaiataria stretch', wave:'Wave 3 \u2014 Ver\u00e3o', start:'2026-07-28', days:{research:4,design:6,production:10,revision:3,release:2}, actualStage:'production', notes:'Ajustar caimento na cintura antes da revis\u00e3o.' },\n  { id:'p3', name:'Vestido Envelope', fabric:'Viscose fluida', wave:'Wave 4 \u2014 C\u00e1psula', start:'2026-08-04', days:{research:3,design:5,production:9,revision:3,release:2}, actualStage:'design', notes:'' },\n  { id:'p4', name:'Blazer Oversized', fabric:'L\u00e3 fria', wave:'Wave 4 \u2014 C\u00e1psula', start:'2026-08-01', days:{research:4,design:7,production:12,revision:4,release:2}, actualStage:'production', notes:'' },\n  { id:'p5', name:'Top N\u00f3 nas Costas', fabric:'Malha canelada', wave:'Essentials', start:'2026-08-10', days:{research:2,design:3,production:5,revision:2,release:1}, actualStage:'research', notes:'' },\n  { id:'p6', name:'Saia Midi God\u00ea', fabric:'Tencel', wave:'Wave 4 \u2014 C\u00e1psula', start:'2026-07-15', days:{research:3,design:5,production:9,revision:3,release:2}, actualStage:'revision', notes:'Atrasada \u2014 priorizar corte esta semana.' },\n  { id:'p7', name:'Macac\u00e3o Utilit\u00e1rio', fabric:'Sarja leve', wave:'Artsy', start:'2026-08-18', days:{research:3,design:6,production:10,revision:3,release:2}, actualStage:'research', notes:'' },\n];\n\nclass Component extends DCLogic {\n  state = { view:'kanban', monthCursor: new Date(2026,7,1), selectedId:null, pieces: SAMPLE, draggedId:null, creating:null, editingId:null, editDraft:null };\n\n  schedule(piece){\n    const start = parseDate(piece.start);\n    let cur = start;\n    const segs = [];\n    STAGES.forEach(st=>{\n      const d = piece.days[st.key]||0;\n      const segStart = cur;\n      const segEnd = addDays(cur, d-1);\n      segs.push({ key:st.key, label:st.label, color:st.color, days:d, start:segStart, end:segEnd });\n      cur = addDays(cur, d);\n    });\n    const total = segs.reduce((s,x)=>s+x.days,0);\n    const deadline = addDays(start, total-1);\n    return { start, deadline, total, segs };\n  }\n\n  dayColors(sched){\n    const arr = [];\n    sched.segs.forEach(seg=>{ for(let i=0;i<seg.days;i++) arr.push(seg.color); });\n    return arr;\n  }\n\n  setView(v){ this.setState({ view:v }); }\n  openDetail(id){ this.setState({ selectedId:id, editingId:null, editDraft:null }); }\n  closeDetail(){ this.setState({ selectedId:null, editingId:null, editDraft:null }); }\n\n  startEdit(id){\n    const p = this.state.pieces.find(x=>x.id===id);\n    if(!p) return;\n    this.setState({ editingId:id, editDraft:{ name:p.name, fabric:p.fabric, wave:p.wave, start:p.start, notes:p.notes||'', days:{...p.days} } });\n  }\n  cancelEdit(){ this.setState({ editingId:null, editDraft:null }); }\n  updateEditDraft(field, value){ this.setState(s=>({ editDraft:{...s.editDraft, [field]:value} })); }\n  updateEditDraftDay(stageKey, value){ this.setState(s=>({ editDraft:{...s.editDraft, days:{...s.editDraft.days, [stageKey]:value} } })); }\n  saveEdit(){\n    this.setState(s=>{\n      const id = s.editingId;\n      const d = s.editDraft;\n      if(!id || !d) return {};\n      return {\n        pieces: s.pieces.map(p=>p.id===id ? { ...p, name:d.name||p.name, fabric:d.fabric, wave:d.wave, start:d.start||p.start, notes:d.notes, days:d.days } : p),\n        editingId:null, editDraft:null,\n      };\n    });\n  }\n  deletePiece(id){\n    const p = this.state.pieces.find(x=>x.id===id);\n    const label = p ? p.name : 'esta pe\u00e7a';\n    if(typeof confirm==='function' && !confirm('Apagar \"'+label+'\"? Essa a\u00e7\u00e3o n\u00e3o pode ser desfeita.')) return;\n    this.setState(s=>({\n      pieces: s.pieces.filter(x=>x.id!==id),\n      selectedId: s.selectedId===id ? null : s.selectedId,\n      editingId: s.editingId===id ? null : s.editingId,\n      editDraft: s.editingId===id ? null : s.editDraft,\n    }));\n  }\n  moveMonth(delta){ this.setState(s=>{ const m=new Date(s.monthCursor); m.setMonth(m.getMonth()+delta); return { monthCursor:m }; }); }\n  goToday(){ this.setState({ monthCursor: new Date(2026,7,1) }); }\n  setStage(id, stageKey){ this.setState(s=>({ pieces: s.pieces.map(p=>p.id===id?{...p,actualStage:stageKey}:p) })); }\n  updateStageDays(id, stageKey, val){ this.setState(s=>({ pieces: s.pieces.map(p=>p.id===id?{...p,days:{...p.days,[stageKey]:val}}:p) })); }\n\n  startCreate(){ this.setState({ creating: { name:'', fabric:'', wave:'', start:'2026-08-10', days:{research:3,design:5,production:8,revision:3,release:2} } }); }\n  cancelCreate(){ this.setState({ creating:null }); }\n  updateDraft(field, value){ this.setState(s=>({ creating:{...s.creating, [field]:value} })); }\n  updateDraftDay(stageKey, value){ this.setState(s=>({ creating:{...s.creating, days:{...s.creating.days, [stageKey]:value} } })); }\n  submitCreate(){\n    this.setState(s=>{\n      const c = s.creating;\n      const id = 'p'+Date.now();\n      const piece = { id, name: c.name||'Nova pe\u00e7a', fabric: c.fabric, wave: c.wave, start: c.start, days: c.days, actualStage:'research', notes:'' };\n      return { pieces:[...s.pieces, piece], creating:null, selectedId:id };\n    });\n  }\n\n  buildWeeks(monthCursor, pieces, today){\n    const y = monthCursor.getFullYear(), m = monthCursor.getMonth();\n    const firstOfMonth = new Date(y,m,1);\n    const firstWeekday = (firstOfMonth.getDay()+6)%7; // Mon=0\n    const gridStart = addDays(firstOfMonth, -firstWeekday);\n    const lastOfMonth = new Date(y,m+1,0);\n    const lastWeekday = (lastOfMonth.getDay()+6)%7;\n    const gridEnd = addDays(lastOfMonth, 6-lastWeekday);\n    const totalDays = diffDays(gridEnd, gridStart)+1;\n    const numWeeks = totalDays/7;\n\n    const scheduled = pieces.map(p=>({ piece:p, sched:this.schedule(p), colors:null }));\n    scheduled.forEach(s=>{ s.colors = this.dayColors(s.sched); });\n\n    const weeks = [];\n    for(let w=0; w<numWeeks; w++){\n      const weekStart = addDays(gridStart, w*7);\n      const weekEnd = addDays(weekStart, 6);\n      const days = [];\n      for(let i=0;i<7;i++){\n        const d = addDays(weekStart, i);\n        const inMonth = d.getMonth()===m;\n        const isToday = stripTime(d)===stripTime(today);\n        days.push({ num:d.getDate(), color: inMonth?'#1f2427':'#c7c5bc', weight: isToday?'800':'500', todayBg: isToday?'#1f2427':'transparent' });\n        if(isToday && days[days.length-1].todayBg==='#1f2427'){ days[days.length-1].color = '#fff'; }\n      }\n      const overlapping = scheduled.filter(s=> s.sched.start<=weekEnd && s.sched.deadline>=weekStart);\n      overlapping.sort((a,b)=> a.sched.start-b.sched.start);\n      const lanes = [];\n      const bars = [];\n      overlapping.forEach(s=>{\n        const startCol = Math.max(0, diffDays(s.sched.start, weekStart));\n        const endCol = Math.min(6, diffDays(s.sched.deadline, weekStart));\n        let lane = 0;\n        while(lanes[lane] !== undefined && lanes[lane] >= startCol) lane++;\n        lanes[lane] = endCol;\n        const span = endCol-startCol+1;\n        const dayIdxStart = diffDays(weekStart, s.sched.start) + startCol - Math.max(0,diffDays(s.sched.start,weekStart))*0; // simplified below\n        const startOffset = Math.max(0, diffDays(weekStart, s.sched.start))*-1;\n        const idx0 = Math.max(0, diffDays(weekStart, s.sched.start));\n        const sliceStart = idx0;\n        const sliceLen = span;\n        const colors = s.colors.slice(sliceStart, sliceStart+sliceLen);\n        const segs = [];\n        let i=0;\n        while(i<colors.length){\n          let j=i;\n          while(j<colors.length && colors[j]===colors[i]) j++;\n          segs.push({ width: (j-i)/colors.length*100, bg: colors[i] });\n          i=j;\n        }\n        bars.push({\n          id: s.piece.id, name: s.piece.name,\n          left: startCol/7*100, width: span/7*100,\n          top: 30 + lane*22, segments: segs\n        });\n      });\n      const height = 34 + Math.max(1, lanes.length)*22 + 6;\n      weeks.push({ key:w, days, bars, height });\n    }\n    return weeks;\n  }\n\n  renderVals(){\n    const { view, monthCursor, selectedId, pieces, editingId, editDraft } = this.state;\n    const today = new Date(2026,7,10);\n\n    const stages = STAGES.map(st=>{\n      const inStage = pieces.filter(p=>p.actualStage===st.key);\n      const avgDays = inStage.length ? Math.round(inStage.reduce((s,p)=>s+(p.days[st.key]||0),0)/inStage.length) : (pieces.reduce((s,p)=>s+(p.days[st.key]||0),0)/pieces.length);\n      return {\n        key: st.key, label: st.label, color: st.color, count: inStage.length,\n        avgLabel: Math.round(avgDays)+'d',\n        pieces: inStage.map(p=>this.cardVM(p, today))\n      };\n    });\n\n    const weeks = this.buildWeeks(monthCursor, pieces, today);\n    const selected = selectedId ? this.detailVM(pieces.find(p=>p.id===selectedId), today) : null;\n    const creating = this.state.creating;\n    const draftStages = creating ? STAGES.map(st=>({ key:st.key, label:st.label, color:st.color, days: creating.days[st.key] })) : [];\n    const isEditing = !!(selected && editingId === selectedId && editDraft);\n    const editDraftStages = isEditing ? STAGES.map(st=>({ key:st.key, label:st.label, color:st.color, days: editDraft.days[st.key] })) : [];\n\n    return {\n      hasCreating: !!creating, creating, draftStages,\n      startCreate: ()=>this.startCreate(), cancelCreate: ()=>this.cancelCreate(), submitCreate: ()=>this.submitCreate(),\n      updateDraftFromEvent: (e)=>this.updateDraft(e.currentTarget.dataset.field, e.currentTarget.value),\n      updateDraftDayFromEvent: (e)=>this.updateDraftDay(e.currentTarget.dataset.stage, Math.max(0, parseInt(e.currentTarget.value)||0)),\n      isKanban: view==='kanban', isCalendar: view==='calendar',\n      setViewKanban: ()=>this.setView('kanban'), setViewCalendar: ()=>this.setView('calendar'),\n      kanbanBg: view==='kanban'?'#1f2427':'transparent', kanbanColor: view==='kanban'?'#faf9f6':'#6b6f66',\n      calBg: view==='calendar'?'#1f2427':'transparent', calColor: view==='calendar'?'#faf9f6':'#6b6f66',\n      stages,\n      allowDrop: (e)=>e.preventDefault(),\n      dropFromEvent: (e)=>{ e.preventDefault(); const id=e.dataTransfer.getData('text/plain'); const stageKey=e.currentTarget.dataset.stage; if(id && stageKey) this.setStage(id, stageKey); },\n      dragStartFromEvent: (e)=>{ e.dataTransfer.setData('text/plain', e.currentTarget.dataset.id); },\n      openDetailFromEvent: (e)=>{ this.openDetail(e.currentTarget.dataset.id); },\n      updateDaysFromEvent: (e)=>{ const val=Math.max(0, parseInt(e.currentTarget.value)||0); this.updateStageDays(e.currentTarget.dataset.id, e.currentTarget.dataset.stage, val); },\n      monthLabel: MONTHS_PT[monthCursor.getMonth()]+' '+monthCursor.getFullYear(),\n      weekdayLabels: WEEKDAYS_PT,\n      prevMonth: ()=>this.moveMonth(-1), nextMonth: ()=>this.moveMonth(1), goToday: ()=>this.goToday(),\n      weeks,\n      hasSelected: !!selected, selected,\n      closeDetail: ()=>this.closeDetail(),\n      stopClick: (e)=>e.stopPropagation(),\n      isViewing: !!selected && !isEditing,\n      isEditing, editDraft: editDraft||{}, editDraftStages,\n      startEditFromEvent: (e)=>this.startEdit(e.currentTarget.dataset.id),\n      cancelEditFromEvent: ()=>this.cancelEdit(),\n      saveEditFromEvent: ()=>this.saveEdit(),\n      deleteSelectedFromEvent: (e)=>this.deletePiece(e.currentTarget.dataset.id),\n      updateEditDraftFromEvent: (e)=>this.updateEditDraft(e.currentTarget.dataset.field, e.currentTarget.value),\n      updateEditDraftDayFromEvent: (e)=>this.updateEditDraftDay(e.currentTarget.dataset.stage, Math.max(0, parseInt(e.currentTarget.value)||0)),\n    };\n  }\n\n  status(sched, actualStage, today){\n    const seg = sched.segs.find(s=>s.key===actualStage);\n    if (today < seg.start) return { label:'Adiantado', color:'#2b3a5b', bg:'#eef0f5' };\n    if (today > seg.end) return { label:'Atrasado '+diffDays(today, seg.end)+'d', color:'#a8422f', bg:'#f7e9e6' };\n    return { label:'No prazo', color:'#57624a', bg:'#eaeee6' };\n  }\n\n  cardVM(p, today){\n    const sched = this.schedule(p);\n    const overdue = sched.deadline < today && p.actualStage !== 'release';\n    const total = sched.total;\n    const segments = sched.segs.map(s=>({ width: s.days/total*100, bg: s.color, opacity: s.key===p.actualStage?1:0.35 }));\n    const status = this.status(sched, p.actualStage, today);\n    return {\n      id: p.id, name: p.name, fabric: p.fabric, wave: p.wave,\n      thumbId: 'thumb-'+p.id,\n      segments,\n      startLabel: fmtShort(sched.start), deadlineLabel: fmtShort(sched.deadline),\n      deadlineColor: overdue ? '#a8422f' : '#6b6f66',\n      overdueBorder: overdue ? '#a8422f' : 'transparent',\n      statusLabel: status.label, statusColor: status.color, statusBg: status.bg,\n    };\n  }\n\n  detailVM(p, today){\n    const sched = this.schedule(p);\n    const overdue = sched.deadline < today && p.actualStage !== 'release';\n    const status = this.status(sched, p.actualStage, today);\n    const timeline = sched.segs.map(s=>({\n      key: s.key,\n      label: s.label, color: s.color, startLabel: fmtShort(s.start), endLabel: fmtShort(s.end),\n      days: s.days, daysLabel: s.days+'d',\n      rowBg: s.key===p.actualStage ? '#eceae2' : 'transparent',\n      rowBorder: s.key===p.actualStage ? '#d8d6cc' : '#eceae2',\n    }));\n    return {\n      id: p.id, name: p.name, fabric: p.fabric, wave: p.wave, notes: p.notes,\n      sketchId: 'sketch-'+p.id, fabricImgId: 'fabricimg-'+p.id, progressId: 'progress-'+p.id,\n      timeline,\n      startLabel: fmtShort(sched.start), deadlineLabel: fmtShort(sched.deadline),\n      deadlineColor: overdue ? '#a8422f' : '#1f2427',\n      statusLabel: status.label, statusColor: status.color, statusBg: status.bg,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
